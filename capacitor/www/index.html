<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shubix</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
      background: radial-gradient(120% 80% at 50% 30%, #2a1450 0%, #0a0a1f 70%); color: #f6f4ff;
      font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    main { max-width: 320px; display: grid; gap: 14px; justify-items: center; }
    .logo { width: 72px; height: 72px; border-radius: 20px; background: linear-gradient(135deg, #e040fb, #7c3aed); display: grid; place-items: center; font: 800 34px system-ui; }
    h1 { margin: 6px 0 0; font-size: 22px; }
    p { margin: 0; opacity: .75; }
    button { margin-top: 8px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 14px; font: 700 15px system-ui;
      color: #fff; background: linear-gradient(90deg, #d946ef, #6d5bf0); }
  </style>
</head>
<body>
  <!-- shown by the app when Shubix's server cannot be reached (capacitor.config.ts errorPath) -->
  <main>
    <div class="logo">S</div>
    <h1>Shubix can't connect</h1>
    <p>Check your internet connection and try again.</p>
    <button type="button" onclick="history.length > 1 ? history.back() : location.reload()">Try again</button>
  </main>
</body>
</html>
