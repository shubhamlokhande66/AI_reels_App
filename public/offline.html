<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>You're offline · Shubix</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100svh;display:grid;place-items:center;background:#05060a;color:#f3ede3;font:15px/1.5 system-ui,-apple-system,sans-serif;text-align:center;padding:24px}
  main{max-width:340px;display:grid;gap:14px;justify-items:center}
  img{width:min(300px,80vw);height:auto}
  h1{font:600 26px Georgia,serif;margin:6px 0 0}
  p{margin:0;color:#a69d90}
  button{height:48px;padding:0 22px;border:0;border-radius:14px;background:linear-gradient(135deg,#f1dcb0,#d4b07a 45%,#a9824a);color:#1a140c;font:700 15px system-ui,sans-serif;cursor:pointer}
</style>
</head>
<body>
<main>
  <img src="/brand/shubix-logo-sm.webp" alt="Shubix">
  <h1>You're offline</h1>
  <p>Check your internet connection, then try again. Your projects are safe.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
