<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a1f">
<title>You're offline · Shubix</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100svh;display:grid;place-items:center;background:#0a0a1f;color:#f6f4ff;font:15px/1.5 system-ui,-apple-system,sans-serif;text-align:center;padding:24px}
  main{max-width:340px;display:grid;gap:14px;justify-items:center}
  img{width:min(300px,80vw);height:auto}
  h1{font:800 26px system-ui,-apple-system,sans-serif;margin:6px 0 0}
  p{margin:0;color:#a3a1c9}
  button{height:48px;padding:0 22px;border:0;border-radius:14px;background:linear-gradient(100deg,#e040fb,#a855f7 52%,#6d5dfc);color:#fff;font:700 15px system-ui,sans-serif;cursor:pointer}
</style>
</head>
<body>
<main>
  <img src="/brand/shubix-gold-sm.webp" alt="Shubix">
  <h1>You're offline</h1>
  <p>Check your internet connection, then try again. Your projects are safe.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
