plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.shubix'
version = '1.0.0'

android {
  namespace "expo.modules.shubixvideo"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

// Google's Media3 Transformer: joins the clips, applies their changes and the texts, mixes the song and writes the MP4
def media3 = "1.9.1"
dependencies {
  implementation "com.facebook.react:react-android" // the JS task that keeps timers running (ShubixWorkService)
  implementation "androidx.media3:media3-transformer:$media3"
  implementation "androidx.media3:media3-effect:$media3"
  implementation "androidx.media3:media3-common:$media3"
  // who is the person in a shot, on the phone (text behind the person in the live player: PersonMask.kt)
  implementation "com.google.mlkit:segmentation-selfie:16.0.0-beta6"
  // the AI models on the phone itself (Models.kt); the same version as the page's onnxruntime-web
  implementation "com.microsoft.onnxruntime:onnxruntime-android:1.29.0"
}
